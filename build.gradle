plugins {
    id 'java'
    id 'org.beryx.jlink' version '2.25.0'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.desktop'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "JxBrowser"
        url 'https://europe-maven.pkg.dev/jxbrowser/releases'
        name = 'com.teamdev'
    }
}

javafx {
    version = '17.0.12'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

dependencies {
    // Web MVC
    implementation("org.springframework.boot:spring-boot-starter-web") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

    // Logging
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // SpringBoot JavaFX
    implementation 'net.rgielen:javafx-weaver-spring-boot-starter:1.3.0'

    // JX Browser
    implementation 'com.teamdev.jxbrowser:jxbrowser-cross-platform:8.2.1'
    implementation 'com.teamdev.jxbrowser:jxbrowser-javafx:8.2.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}